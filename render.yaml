services:
  - type: web
    name: delta-carburant-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: delta-carburant-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CARD_ENCRYPTION_KEY
        generateValue: true
      - key: CARD_HMAC_KEY
        generateValue: true
      - key: PIN_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LOGIN_ALERT_FROM
        sync: false
      - key: LOGIN_ALERT_TO
        value: khaled.sfaxi@deltacuisine.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DIRECTION_MAIL_TO
        value: khaled.sfaxi@deltacuisine.com
      - key: APPLICATION_URL
        sync: false
      - key: TOTAL_USERNAME
        sync: false
      - key: TOTAL_PASSWORD
        sync: false
      - key: TOTAL_LIVE_SYNC_MINUTES
        value: 1
      - key: TOTAL_AGENT_RESTART_SECONDS
        value: 60

  - type: web
    name: delta-carburant-web
    runtime: node
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev --prefix apps/web && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://delta-carburant-api.onrender.com

databases:
  - name: delta-carburant-db
    region: frankfurt
    plan: free
    databaseName: delta_carburant
    user: delta_carburant
