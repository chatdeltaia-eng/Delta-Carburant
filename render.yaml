services:
  - type: web
    name: delta-carburant-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev --prefix apps/api && npm run build --prefix apps/api
    startCommand: node apps/api/scripts/migrate.js && npm run start:prod --prefix apps/api
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: delta-carburant-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CARD_ENCRYPTION_KEY
        generateValue: true
      - key: CARD_HMAC_KEY
        generateValue: true
      - key: PIN_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LOGIN_ALERT_FROM
        sync: false
      - key: LOGIN_ALERT_TO
        value: Khaled.sfaxi@deltacuisine.com

  - type: web
    name: delta-carburant-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev --prefix apps/web && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://delta-carburant-api.onrender.com

databases:
  - name: delta-carburant-db
    region: frankfurt
    plan: free
    databaseName: delta_carburant
    user: delta_carburant
